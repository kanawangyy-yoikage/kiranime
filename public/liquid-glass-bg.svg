<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Flat black backdrop — matches non-liquid-glass dark mode (bg-dark: #000000).
       No aurora/gradient: the glass surfaces keep their own sheen + rim highlights,
       so the liquid look stays without recoloring the page background. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#000000"/>
  <rect width="1920" height="1080" fill="url(#sheen)"/>
</svg>